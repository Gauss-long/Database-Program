<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高校竞赛项目管理系统</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      color: #1f2937;
      background: #edf3f8;
    }
    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 236px 1fr;
    }
    .sidebar {
      padding: 24px 18px;
      background: #15324a;
      color: #fff;
    }
    .sidebar h1 {
      margin: 0 0 26px;
      font-size: 21px;
      line-height: 1.45;
    }
    .nav {
      display: grid;
      gap: 8px;
    }
    .nav button, .logout {
      width: 100%;
      height: 40px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      padding: 0 12px;
      font-size: 14px;
      color: #d9e6ef;
      background: transparent;
    }
    .nav button.active {
      color: #fff;
      background: #1f7a8c;
    }
    .logout {
      margin-top: 24px;
      color: #15324a;
      text-align: center;
      background: #dbe7ef;
    }
    .main {
      padding: 26px;
      overflow: auto;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .topbar h2 {
      margin: 0;
      font-size: 24px;
      color: #15324a;
    }
    .user {
      color: #526170;
      font-size: 14px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .card, .panel {
      background: #fff;
      border: 1px solid #d8e1e8;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(31, 41, 55, 0.06);
    }
    .card {
      padding: 18px;
    }
    .num {
      font-size: 30px;
      font-weight: 700;
      color: #15324a;
    }
    .label {
      margin-top: 6px;
      color: #697889;
      font-size: 14px;
    }
    .panel {
      padding: 18px;
      margin-bottom: 18px;
    }
    .panel h3 {
      margin: 0 0 14px;
      font-size: 18px;
      color: #15324a;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
      gap: 18px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #e5edf3;
      text-align: left;
      vertical-align: middle;
    }
    th {
      color: #526170;
      background: #f6f9fb;
    }
    button {
      height: 36px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      padding: 0 13px;
      font-size: 14px;
      background: #dbe7ef;
      color: #15324a;
    }
    button.primary {
      background: #1f7a8c;
      color: #fff;
    }
    button.danger {
      background: #b64b4b;
      color: #fff;
    }
    .ops {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: end;
    }
    label {
      display: block;
      margin: 0 0 6px;
      color: #526170;
      font-size: 13px;
    }
    input, select {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #c8d3dc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .notice {
      min-height: 24px;
      margin-top: 12px;
      color: #526170;
      line-height: 1.7;
      font-size: 14px;
    }
    .section {
      display: none;
    }
    .section.active {
      display: block;
    }
    @media (max-width: 980px) {
      .page, .grid, .cards, .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <h1>高校竞赛项目管理系统</h1>
      <div class="nav">
        <button class="active" data-section="home">首页看板</button>
        <button data-section="projects">项目管理</button>
        <button data-section="registration">竞赛报名</button>
        <button data-section="summary">项目统计</button>
      </div>
      <button class="logout" id="logoutBtn">退出登录</button>
    </aside>

    <main class="main">
      <div class="topbar">
        <h2 id="pageTitle">首页看板</h2>
        <span class="user">当前用户：<strong id="currentUser"></strong></span>
      </div>

      <section class="section active" id="home">
        <div class="cards">
          <div class="card"><div class="num" id="projectTotal">-</div><div class="label">项目数量</div></div>
          <div class="card"><div class="num" id="competitionTotal">-</div><div class="label">竞赛数量</div></div>
          <div class="card"><div class="num" id="teamTotal">-</div><div class="label">团队数量</div></div>
          <div class="card"><div class="num" id="achievementTotal">-</div><div class="label">成果数量</div></div>
        </div>
        <section class="panel">
          <h3>项目状态分布</h3>
          <table>
            <thead><tr><th>状态</th><th>数量</th></tr></thead>
            <tbody id="statusRows"></tbody>
          </table>
        </section>
      </section>

      <section class="section" id="projects">
        <section class="panel">
          <h3>项目管理</h3>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>项目名称</th>
                <th>类型</th>
                <th>团队</th>
                <th>教师</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="projectRows"></tbody>
          </table>
          <div class="notice" id="projectNotice">删除项目会同时处理成果、经费和项目扩展记录。</div>
        </section>
      </section>

      <section class="section" id="registration">
        <div class="grid">
          <section class="panel">
            <h3>团队报名竞赛</h3>
            <div class="form-grid">
              <div>
                <label for="teamSelect">报名团队</label>
                <select id="teamSelect"></select>
              </div>
              <div>
                <label for="competitionSelect">竞赛</label>
                <select id="competitionSelect"></select>
              </div>
              <div>
                <label for="registrationStatus">报名状态</label>
                <input id="registrationStatus" value="已报名" />
              </div>
              <button class="primary" id="registerCompetitionBtn">提交报名</button>
            </div>
            <div class="notice" id="registrationNotice">提交报名时，数据库触发器会检查报名条件。</div>
          </section>
          <section class="panel">
            <h3>触发器失败演示</h3>
            <p class="notice">将报名状态清空后提交，触发器会阻止插入并返回错误。</p>
            <button id="emptyStatusBtn">清空状态并提交</button>
          </section>
        </div>
      </section>

      <section class="section" id="summary">
        <section class="panel">
          <h3>项目综合统计</h3>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>项目名称</th>
                <th>类型</th>
                <th>状态</th>
                <th>团队</th>
                <th>指导教师</th>
                <th>成果数</th>
                <th>经费总额</th>
              </tr>
            </thead>
            <tbody id="summaryRows"></tbody>
          </table>
          <div class="notice">本表数据来自数据库视图 v_ProjectSummary。</div>
        </section>
      </section>
    </main>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const currentUser = localStorage.getItem("currentUser");
    const $ = (id) => document.getElementById(id);

    if (!currentUser) {
      window.location.href = "login.html";
    }
    $("currentUser").textContent = currentUser || "";

    async function request(path, options = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "请求失败");
      return data;
    }

    function showSection(id, title) {
      document.querySelectorAll(".section").forEach((item) => item.classList.remove("active"));
      document.querySelectorAll(".nav button").forEach((item) => item.classList.remove("active"));
      $(id).classList.add("active");
      document.querySelector(`[data-section="${id}"]`).classList.add("active");
      $("pageTitle").textContent = title;
    }

    async function loadDashboard() {
      const data = await request("/api/statistics/dashboard");
      $("projectTotal").textContent = data.project_total;
      $("competitionTotal").textContent = data.competition_total;
      $("teamTotal").textContent = data.team_total;
      $("achievementTotal").textContent = data.achievement_total;
      $("statusRows").innerHTML = data.status_distribution.map((row) => `
        <tr><td>${row.name || "未设置"}</td><td>${row.value}</td></tr>
      `).join("");
    }

    async function loadProjects() {
      const rows = await request("/api/projects");
      $("projectRows").innerHTML = rows.map((row) => `
        <tr>
          <td>${row.ProjectID}</td>
          <td>${row.ProjectName}</td>
          <td>${row.ProjectType || ""}</td>
          <td>${row.TeamName || ""}</td>
          <td>${row.TeacherName || ""}</td>
          <td>${row.ProjectStatus || ""}</td>
          <td>
            <div class="ops">
              <button class="primary" onclick="updateStatus(${row.ProjectID})">更新状态</button>
              <button class="danger" onclick="deleteProject(${row.ProjectID})">删除</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    async function loadLookups() {
      const [teams, competitions] = await Promise.all([
        request("/api/lookups/teams"),
        request("/api/lookups/competitions"),
      ]);
      $("teamSelect").innerHTML = teams.map((row) => `
        <option value="${row.TeamID}">${row.TeamName}</option>
      `).join("");
      $("competitionSelect").innerHTML = competitions.map((row) => `
        <option value="${row.CompetitionID}">${row.CompetitionName}</option>
      `).join("");
    }

    async function loadSummary() {
      const rows = await request("/api/statistics/project-summary");
      $("summaryRows").innerHTML = rows.map((row) => `
        <tr>
          <td>${row.ProjectID}</td>
          <td>${row.ProjectName}</td>
          <td>${row.ProjectType || ""}</td>
          <td>${row.ProjectStatus || ""}</td>
          <td>${row.TeamName || ""}</td>
          <td>${row.TeacherName || ""}</td>
          <td>${row.AchievementCount}</td>
          <td>${row.TotalFunding}</td>
        </tr>
      `).join("");
    }

    async function refreshAll() {
      await Promise.all([loadDashboard(), loadProjects(), loadLookups(), loadSummary()]);
    }

    async function deleteProject(projectId) {
      if (!confirm(`确定删除项目 ${projectId} 吗？`)) return;
      try {
        const data = await request(`/api/projects/${projectId}`, { method: "DELETE" });
        $("projectNotice").textContent = data.message;
        await refreshAll();
      } catch (err) {
        $("projectNotice").textContent = err.message;
      }
    }

    async function updateStatus(projectId) {
      try {
        const data = await request(`/api/projects/${projectId}/status`, { method: "PUT" });
        $("projectNotice").textContent = `项目 ${data.ProjectID} 状态已更新为：${data.ProjectStatus}`;
        await refreshAll();
      } catch (err) {
        $("projectNotice").textContent = err.message;
      }
    }

    async function createRegistration(forceEmptyStatus = false) {
      const status = forceEmptyStatus ? "" : $("registrationStatus").value.trim();
      try {
        const data = await request("/api/registrations", {
          method: "POST",
          body: JSON.stringify({
            team_id: Number($("teamSelect").value),
            competition_id: Number($("competitionSelect").value),
            status,
          }),
        });
        $("registrationNotice").textContent = data.message;
      } catch (err) {
        $("registrationNotice").textContent = err.message;
      }
    }

    document.querySelectorAll(".nav button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const titleMap = {
          home: "首页看板",
          projects: "项目管理",
          registration: "竞赛报名",
          summary: "项目统计",
        };
        showSection(btn.dataset.section, titleMap[btn.dataset.section]);
      });
    });
    $("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("currentUser");
      window.location.href = "login.html";
    });
    $("registerCompetitionBtn").addEventListener("click", () => createRegistration(false));
    $("emptyStatusBtn").addEventListener("click", () => createRegistration(true));

    refreshAll();
  </script>
</body>
</html>
