<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高校竞赛项目管理系统</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      color: #1f2937;
      background: #edf3f8;
    }
    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 236px 1fr;
    }
    .sidebar {
      padding: 24px 18px;
      background: #15324a;
      color: #fff;
    }
    .sidebar h1 {
      margin: 0 0 26px;
      font-size: 21px;
      line-height: 1.45;
    }
    .nav { display: grid; gap: 8px; }
    .nav button, .logout {
      width: 100%;
      height: 40px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      padding: 0 12px;
      font-size: 14px;
      color: #d9e6ef;
      background: transparent;
    }
    .nav button.active {
      color: #fff;
      background: #1f7a8c;
    }
    .logout {
      margin-top: 24px;
      color: #15324a;
      text-align: center;
      background: #dbe7ef;
    }
    .main {
      padding: 26px;
      overflow: auto;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .topbar h2 {
      margin: 0;
      font-size: 24px;
      color: #15324a;
    }
    .user {
      color: #526170;
      font-size: 14px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .card, .panel {
      background: #fff;
      border: 1px solid #d8e1e8;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(31, 41, 55, 0.06);
    }
    .card { padding: 18px; }
    .num {
      font-size: 30px;
      font-weight: 700;
      color: #15324a;
    }
    .label {
      margin-top: 6px;
      color: #697889;
      font-size: 14px;
    }
    .panel {
      padding: 18px;
      margin-bottom: 18px;
    }
    .panel h3 {
      margin: 0 0 14px;
      font-size: 18px;
      color: #15324a;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 0.75fr);
      gap: 18px;
    }
    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #e5edf3;
      text-align: left;
      vertical-align: middle;
    }
    th {
      color: #526170;
      background: #f6f9fb;
    }
    button {
      height: 36px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      padding: 0 13px;
      font-size: 14px;
      background: #dbe7ef;
      color: #15324a;
    }
    button.primary { background: #1f7a8c; color: #fff; }
    button.danger { background: #b64b4b; color: #fff; }
    .ops { display: flex; gap: 8px; flex-wrap: wrap; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: end;
    }
    label {
      display: block;
      margin: 0 0 6px;
      color: #526170;
      font-size: 13px;
    }
    input, select {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #c8d3dc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .notice {
      min-height: 24px;
      margin-top: 12px;
      color: #526170;
      line-height: 1.7;
      font-size: 14px;
    }
    .section { display: none; }
    .section.active { display: block; }
    @media (max-width: 1100px) {
      .page, .grid, .two, .cards, .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <h1>高校竞赛项目管理系统</h1>
      <div class="nav">
        <button class="active" data-section="home">首页看板</button>
        <button data-section="people">人员管理</button>
        <button data-section="teams">团队管理</button>
        <button data-section="apply">项目申报</button>
        <button data-section="projects">项目管理</button>
      </div>
      <button class="logout" id="logoutBtn">退出登录</button>
    </aside>

    <main class="main">
      <div class="topbar">
        <h2 id="pageTitle">首页看板</h2>
        <span class="user">当前用户：<strong id="currentUser"></strong></span>
      </div>

      <section class="section active" id="home">
        <div class="cards">
          <div class="card"><div class="num" id="projectTotal">-</div><div class="label">项目数量</div></div>
          <div class="card"><div class="num" id="competitionTotal">-</div><div class="label">竞赛数量</div></div>
          <div class="card"><div class="num" id="teamTotal">-</div><div class="label">团队数量</div></div>
          <div class="card"><div class="num" id="achievementTotal">-</div><div class="label">成果数量</div></div>
        </div>
        <div class="two">
          <section class="panel">
            <h3>项目状态分布</h3>
            <table><thead><tr><th>状态</th><th>数量</th></tr></thead><tbody id="statusRows"></tbody></table>
          </section>
          <section class="panel">
            <h3>最近项目</h3>
            <table><thead><tr><th>项目名称</th><th>团队</th><th>状态</th></tr></thead><tbody id="recentRows"></tbody></table>
          </section>
        </div>
      </section>

      <section class="section" id="people">
        <div class="grid">
          <section class="panel">
            <h3>学生信息</h3>
            <table>
              <thead><tr><th>ID</th><th>姓名</th><th>学号</th><th>学院</th><th>专业</th></tr></thead>
              <tbody id="studentRows"></tbody>
            </table>
          </section>
          <section class="panel">
            <h3>新增学生</h3>
            <div class="form-grid">
              <div><label>姓名</label><input id="studentName" /></div>
              <div><label>学号</label><input id="studentNo" /></div>
              <div><label>学院</label><input id="studentCollege" value="软件学院" /></div>
              <div><label>专业</label><input id="studentMajor" value="软件工程" /></div>
              <div><label>年级</label><input id="studentGrade" value="2023" /></div>
              <button class="primary" id="createStudentBtn">新增学生</button>
            </div>
            <div class="notice" id="studentNotice"></div>
          </section>
        </div>
        <div class="grid">
          <section class="panel">
            <h3>教师信息</h3>
            <table>
              <thead><tr><th>ID</th><th>姓名</th><th>工号</th><th>学院</th><th>职称</th></tr></thead>
              <tbody id="teacherRows"></tbody>
            </table>
          </section>
          <section class="panel">
            <h3>新增教师</h3>
            <div class="form-grid">
              <div><label>姓名</label><input id="teacherName" /></div>
              <div><label>工号</label><input id="teacherNo" /></div>
              <div><label>学院</label><input id="teacherCollege" value="软件学院" /></div>
              <div><label>职称</label><input id="teacherTitle" value="讲师" /></div>
              <button class="primary" id="createTeacherBtn">新增教师</button>
            </div>
            <div class="notice" id="teacherNotice"></div>
          </section>
        </div>
      </section>

      <section class="section" id="teams">
        <div class="grid">
          <section class="panel">
            <h3>团队列表</h3>
            <table>
              <thead><tr><th>ID</th><th>团队</th><th>负责人</th><th>人数</th><th>操作</th></tr></thead>
              <tbody id="teamRows"></tbody>
            </table>
          </section>
          <section class="panel">
            <h3>创建团队 / 添加成员</h3>
            <div class="form-grid">
              <div><label>团队名称</label><input id="teamName" /></div>
              <div><label>负责人</label><select id="leaderSelect"></select></div>
              <button class="primary" id="createTeamBtn">创建团队</button>
            </div>
            <hr />
            <div class="form-grid">
              <div><label>团队</label><select id="memberTeamSelect"></select></div>
              <div><label>学生</label><select id="memberStudentSelect"></select></div>
              <button class="primary" id="addMemberBtn">添加成员</button>
            </div>
            <div class="notice" id="teamNotice"></div>
          </section>
        </div>
        <section class="panel">
          <h3>团队成员</h3>
          <table>
            <thead><tr><th>ID</th><th>姓名</th><th>学号</th><th>学院</th><th>专业</th></tr></thead>
            <tbody id="memberRows"></tbody>
          </table>
        </section>
      </section>

      <section class="section" id="apply">
        <div class="grid">
          <section class="panel">
            <h3>竞赛报名并创建项目</h3>
            <div class="form-grid">
              <div><label>项目名称</label><input id="competitionProjectName" /></div>
              <div><label>团队</label><select id="competitionTeamSelect"></select></div>
              <div><label>指导教师</label><select id="competitionTeacherSelect"></select></div>
              <div><label>竞赛</label><select id="competitionSelect"></select></div>
              <div><label>报名状态</label><input id="registrationStatus" value="已报名" /></div>
              <button class="primary" id="createCompetitionProjectBtn">提交竞赛项目</button>
            </div>
            <div class="notice" id="competitionNotice">报名状态为空时，数据库触发器会阻止插入。</div>
          </section>
          <section class="panel">
            <h3>科研项目申报</h3>
            <div class="form-grid">
              <div><label>项目名称</label><input id="researchProjectName" /></div>
              <div><label>团队</label><select id="researchTeamSelect"></select></div>
              <div><label>指导教师</label><select id="researchTeacherSelect"></select></div>
              <div><label>项目来源</label><input id="researchSource" value="学院科研训练计划" /></div>
              <div><label>科研级别</label><input id="researchLevel" value="院级" /></div>
              <button class="primary" id="createResearchProjectBtn">提交科研项目</button>
            </div>
            <div class="notice" id="researchNotice"></div>
          </section>
        </div>
      </section>

      <section class="section" id="projects">
        <section class="panel">
          <h3>项目管理与统计</h3>
          <table>
            <thead>
              <tr>
                <th>ID</th><th>项目名称</th><th>类型</th><th>团队</th><th>人数</th>
                <th>指导教师</th><th>成果数</th><th>经费</th><th>状态</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="projectRows"></tbody>
          </table>
          <div class="notice" id="projectNotice">本表主要来自视图 v_ProjectSummary。</div>
        </section>
      </section>
    </main>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const currentUser = localStorage.getItem("currentUser");
    const $ = (id) => document.getElementById(id);

    if (!currentUser) window.location.href = "login.html";
    $("currentUser").textContent = currentUser || "";

    async function request(path, options = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "请求失败");
      return data;
    }

    function optionRows(rows, idKey, labelKey) {
      return rows.map((row) => `<option value="${row[idKey]}">${row[labelKey]}</option>`).join("");
    }

    function showSection(id, title) {
      document.querySelectorAll(".section").forEach((item) => item.classList.remove("active"));
      document.querySelectorAll(".nav button").forEach((item) => item.classList.remove("active"));
      $(id).classList.add("active");
      document.querySelector(`[data-section="${id}"]`).classList.add("active");
      $("pageTitle").textContent = title;
    }

    async function loadDashboard() {
      const data = await request("/api/statistics/dashboard");
      $("projectTotal").textContent = data.project_total;
      $("competitionTotal").textContent = data.competition_total;
      $("teamTotal").textContent = data.team_total;
      $("achievementTotal").textContent = data.achievement_total;
      $("statusRows").innerHTML = data.status_distribution.map((row) => `
        <tr><td>${row.name || "未设置"}</td><td>${row.value}</td></tr>
      `).join("");
    }

    async function loadPeople() {
      const [students, teachers] = await Promise.all([
        request("/api/people/students"),
        request("/api/people/teachers"),
      ]);
      $("studentRows").innerHTML = students.map((row) => `
        <tr><td>${row.UserID}</td><td>${row.UserName}</td><td>${row.StuNo}</td><td>${row.College || ""}</td><td>${row.Major || ""}</td></tr>
      `).join("");
      $("teacherRows").innerHTML = teachers.map((row) => `
        <tr><td>${row.UserID}</td><td>${row.UserName}</td><td>${row.TeacherNo}</td><td>${row.College || ""}</td><td>${row.Title || ""}</td></tr>
      `).join("");
    }

    async function loadTeams() {
      const teams = await request("/api/teams");
      $("teamRows").innerHTML = teams.map((row) => `
        <tr>
          <td>${row.TeamID}</td><td>${row.TeamName}</td><td>${row.LeaderName || ""}</td><td>${row.MemberCount}</td>
          <td><button onclick="loadMembers(${row.TeamID})">查看成员</button></td>
        </tr>
      `).join("");
    }

    async function loadMembers(teamId) {
      const rows = await request(`/api/teams/${teamId}/members`);
      $("memberRows").innerHTML = rows.map((row) => `
        <tr><td>${row.UserID}</td><td>${row.UserName}</td><td>${row.StuNo}</td><td>${row.College || ""}</td><td>${row.Major || ""}</td></tr>
      `).join("");
    }

    async function loadLookups() {
      const [students, teachers, teams, competitions] = await Promise.all([
        request("/api/lookups/students"),
        request("/api/lookups/teachers"),
        request("/api/lookups/teams"),
        request("/api/lookups/competitions"),
      ]);
      const studentOptions = optionRows(students, "UserID", "UserName");
      const teacherOptions = optionRows(teachers, "UserID", "UserName");
      const teamOptions = optionRows(teams, "TeamID", "TeamName");
      $("leaderSelect").innerHTML = studentOptions;
      $("memberStudentSelect").innerHTML = studentOptions;
      $("memberTeamSelect").innerHTML = teamOptions;
      $("competitionTeamSelect").innerHTML = teamOptions;
      $("researchTeamSelect").innerHTML = teamOptions;
      $("competitionTeacherSelect").innerHTML = teacherOptions;
      $("researchTeacherSelect").innerHTML = teacherOptions;
      $("competitionSelect").innerHTML = optionRows(competitions, "CompetitionID", "CompetitionName");
    }

    async function loadProjects() {
      const rows = await request("/api/statistics/project-summary");
      $("recentRows").innerHTML = rows.slice(-5).reverse().map((row) => `
        <tr><td>${row.ProjectName}</td><td>${row.TeamName || ""}</td><td>${row.ProjectStatus || ""}</td></tr>
      `).join("");
      $("projectRows").innerHTML = rows.map((row) => `
        <tr>
          <td>${row.ProjectID}</td>
          <td>${row.ProjectName}</td>
          <td>${row.ProjectType || ""}</td>
          <td>${row.TeamName || ""}</td>
          <td>${row.MemberCount}</td>
          <td>${row.TeacherName || ""}</td>
          <td>${row.AchievementCount}</td>
          <td>${row.TotalFunding}</td>
          <td>
            <select id="status-${row.ProjectID}">
              ${["进行中", "已完成", "已延期", "已终止"].map((item) =>
                `<option value="${item}" ${item === row.ProjectStatus ? "selected" : ""}>${item}</option>`
              ).join("")}
            </select>
          </td>
          <td>
            <div class="ops">
              <button class="primary" onclick="updateStatus(${row.ProjectID})">保存</button>
              <button class="danger" onclick="deleteProject(${row.ProjectID})">删除</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    async function refreshAll() {
      await Promise.all([loadDashboard(), loadPeople(), loadTeams(), loadLookups(), loadProjects()]);
    }

    async function createStudent() {
      try {
        const data = await request("/api/people/students", {
          method: "POST",
          body: JSON.stringify({
            user_name: $("studentName").value.trim(),
            stu_no: $("studentNo").value.trim(),
            college: $("studentCollege").value.trim(),
            major: $("studentMajor").value.trim(),
            grade: $("studentGrade").value.trim(),
          }),
        });
        $("studentNotice").textContent = data.message;
        await refreshAll();
      } catch (err) { $("studentNotice").textContent = err.message; }
    }

    async function createTeacher() {
      try {
        const data = await request("/api/people/teachers", {
          method: "POST",
          body: JSON.stringify({
            user_name: $("teacherName").value.trim(),
            teacher_no: $("teacherNo").value.trim(),
            college: $("teacherCollege").value.trim(),
            title: $("teacherTitle").value.trim(),
          }),
        });
        $("teacherNotice").textContent = data.message;
        await refreshAll();
      } catch (err) { $("teacherNotice").textContent = err.message; }
    }

    async function createTeam() {
      try {
        const data = await request("/api/teams", {
          method: "POST",
          body: JSON.stringify({
            team_name: $("teamName").value.trim(),
            leader_id: Number($("leaderSelect").value),
          }),
        });
        $("teamNotice").textContent = data.message;
        await refreshAll();
      } catch (err) { $("teamNotice").textContent = err.message; }
    }

    async function addMember() {
      try {
        const teamId = Number($("memberTeamSelect").value);
        const data = await request(`/api/teams/${teamId}/members`, {
          method: "POST",
          body: JSON.stringify({ student_id: Number($("memberStudentSelect").value) }),
        });
        $("teamNotice").textContent = data.message;
        await refreshAll();
        await loadMembers(teamId);
      } catch (err) { $("teamNotice").textContent = err.message; }
    }

    async function createCompetitionProject() {
      try {
        const data = await request("/api/projects/competition", {
          method: "POST",
          body: JSON.stringify({
            project_name: $("competitionProjectName").value.trim(),
            team_id: Number($("competitionTeamSelect").value),
            teacher_id: Number($("competitionTeacherSelect").value),
            competition_id: Number($("competitionSelect").value),
            registration_status: $("registrationStatus").value.trim(),
          }),
        });
        $("competitionNotice").textContent = data.message;
        await refreshAll();
      } catch (err) { $("competitionNotice").textContent = err.message; }
    }

    async function createResearchProject() {
      try {
        const data = await request("/api/projects/research", {
          method: "POST",
          body: JSON.stringify({
            project_name: $("researchProjectName").value.trim(),
            team_id: Number($("researchTeamSelect").value),
            teacher_id: Number($("researchTeacherSelect").value),
            source: $("researchSource").value.trim(),
            research_level: $("researchLevel").value.trim(),
          }),
        });
        $("researchNotice").textContent = data.message;
        await refreshAll();
      } catch (err) { $("researchNotice").textContent = err.message; }
    }

    async function updateStatus(projectId) {
      try {
        const status = $(`status-${projectId}`).value;
        const data = await request(`/api/projects/${projectId}/status`, {
          method: "PUT",
          body: JSON.stringify({ status }),
        });
        $("projectNotice").textContent = `项目 ${data.ProjectID} 状态已更新为：${data.ProjectStatus}`;
        await refreshAll();
      } catch (err) { $("projectNotice").textContent = err.message; }
    }

    async function deleteProject(projectId) {
      if (!confirm(`确定删除项目 ${projectId} 吗？`)) return;
      try {
        const data = await request(`/api/projects/${projectId}`, { method: "DELETE" });
        $("projectNotice").textContent = data.message;
        await refreshAll();
      } catch (err) { $("projectNotice").textContent = err.message; }
    }

    document.querySelectorAll(".nav button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const titleMap = {
          home: "首页看板",
          people: "人员管理",
          teams: "团队管理",
          apply: "项目申报",
          projects: "项目管理",
        };
        showSection(btn.dataset.section, titleMap[btn.dataset.section]);
      });
    });
    $("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("currentUser");
      window.location.href = "login.html";
    });
    $("createStudentBtn").addEventListener("click", createStudent);
    $("createTeacherBtn").addEventListener("click", createTeacher);
    $("createTeamBtn").addEventListener("click", createTeam);
    $("addMemberBtn").addEventListener("click", addMember);
    $("createCompetitionProjectBtn").addEventListener("click", createCompetitionProject);
    $("createResearchProjectBtn").addEventListener("click", createResearchProject);

    refreshAll();
  </script>
</body>
</html>
